<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="en">
<head th:replace="~{fragments/layout :: head('Manage Domains')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="page-header animate-in d-flex align-items-center justify-content-between">
        <div>
            <h1 class="page-title"><i class="bi bi-collection me-2" style="color:var(--primary-light);"></i>Domain Management</h1>
            <p class="page-subtitle">Add and manage interview domains</p>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success auto-dismiss animate-in">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
    </div>

    <div class="row g-4">
        <!-- ── Add / Edit Form ────────────────────────────────────────────── -->
        <div class="col-lg-4">
            <div class="card animate-in">
                <div class="card-header">
                    <i class="bi bi-plus-circle me-2" style="color:var(--primary-light);"></i>
                    <span th:text="${domain.id != null ? 'Edit Domain' : 'Add New Domain'}">Add Domain</span>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/domains/save}" th:object="${domain}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label">Domain Name *</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   placeholder="e.g. Java" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"
                                      placeholder="Brief description of topics covered"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Bootstrap Icon Class</label>
                            <input type="text" th:field="*{icon}" class="form-control"
                                   placeholder="e.g. bi-cpu"/>
                            <div class="form-text" style="font-size:0.75rem;color:var(--text-dim);">
                                Browse icons at <a href="https://icons.getbootstrap.com" target="_blank" style="color:var(--primary-light);">icons.getbootstrap.com</a>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-check2"></i>
                                <span th:text="${domain.id != null ? 'Update' : 'Add Domain'}">Save</span>
                            </button>
                            <a th:href="@{/admin/domains}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ── Domain List ────────────────────────────────────────────────── -->
        <div class="col-lg-8">
            <div class="card animate-in">
                <div class="card-header">
                    <i class="bi bi-list-ul me-2" style="color:var(--primary-light);"></i>All Domains
                    <span class="badge ms-2" style="background:rgba(99,102,241,0.15);color:var(--primary-light);"
                          th:text="${#lists.size(domains)} + ' domains'">0</span>
                </div>
                <div th:if="${#lists.isEmpty(domains)}" class="card-body text-center py-5" style="color:var(--text-dim);">
                    No domains yet. Add one!
                </div>
                <div th:if="${!#lists.isEmpty(domains)}" class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>Icon</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="d : ${domains}">
                                <td><i th:class="'bi ' + ${d.icon ?: 'bi-book'}" style="color:var(--primary-light);font-size:1.3rem;"></i></td>
                                <td class="fw-600" th:text="${d.name}">Domain</td>
                                <td style="color:var(--text-muted);font-size:0.82rem;max-width:250px;">
                                    <span th:text="${#strings.abbreviate(d.description ?: '', 60)}"></span>
                                </td>
                                <td>
                                    <a th:href="@{'/admin/domains/edit/' + ${d.id}}" class="btn btn-secondary btn-sm me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{'/admin/domains/delete/' + ${d.id}}"
                                       class="btn btn-danger btn-sm"
                                       data-confirm="Delete this domain? All its questions will also be deleted.">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
