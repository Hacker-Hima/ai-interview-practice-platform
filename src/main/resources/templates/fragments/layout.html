<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ═══════════════════════════════════════════════════════════════════════
     HEAD fragment — include in each page:
       <head th:replace="~{fragments/layout :: head('Page Title')}"></head>
     ═══════════════════════════════════════════════════════════════════════ -->
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="AI Interview Practice Platform — Prepare smarter with AI-powered feedback"/>
    <title th:text="${pageTitle} + ' | AI Interview Platform'">AI Interview Platform</title>

    <!-- Bootstrap 5.3 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<!-- ═══════════════════════════════════════════════════════════════════════
     NAVBAR fragment
     ═══════════════════════════════════════════════════════════════════════ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg">
    <div class="container-fluid px-4">

        <!-- Brand -->
        <a class="navbar-brand" th:href="@{/dashboard}">
            <span class="brand-icon">🧠</span>AI Interview
        </a>

        <!-- Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain" aria-label="Toggle navigation">
            <i class="bi bi-list" style="color:var(--text-muted);font-size:1.3rem;"></i>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <!-- Student links -->
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-grid"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/interview}">
                        <i class="bi bi-play-circle"></i> Start Interview
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/history}">
                        <i class="bi bi-clock-history"></i> History
                    </a>
                </li>

                <!-- Admin links -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-speedometer2"></i> Admin
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/domains}">
                        <i class="bi bi-collection"></i> Domains
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/questions}">
                        <i class="bi bi-question-circle"></i> Questions
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">
                        <i class="bi bi-people"></i> Users
                    </a>
                </li>

            </ul>

            <!-- Right side: user menu -->
            <ul class="navbar-nav align-items-center gap-1">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">User</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-secondary btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Logout
                        </button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-primary btn-sm" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ═══════════════════════════════════════════════════════════════════════
     FOOTER fragment
     ═══════════════════════════════════════════════════════════════════════ -->
<footer th:fragment="footer">
    <div class="container">
        <p class="mb-0">
            🧠 <strong style="color:var(--text-muted)">AI Interview Platform</strong>
            &nbsp;·&nbsp; Built with Spring Boot, Thymeleaf &amp; Gemini AI
            &nbsp;·&nbsp; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span>
        </p>
    </div>
</footer>

<!-- ═══════════════════════════════════════════════════════════════════════
     SCRIPTS fragment — place just before </body>
     ═══════════════════════════════════════════════════════════════════════ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/charts.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</div>

</html>
