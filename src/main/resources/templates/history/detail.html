<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="en">
<head th:replace="~{fragments/layout :: head('Session Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-4 animate-in">
        <a th:href="@{/history}" class="btn btn-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to History
        </a>
        <div>
            <h1 class="page-title mb-0" style="font-size:1.3rem;">
                <span th:text="${session.domain.name}">Java</span> — Session Review
            </h1>
            <p class="page-subtitle mb-0" style="font-size:0.8rem;"
               th:text="${#temporals.format(session.startTime, 'dd MMMM yyyy, HH:mm')}">01 Jan 2025</p>
        </div>
        <div class="ms-auto">
            <span th:class="'badge px-3 py-2 fs-6 difficulty-' + ${session.performanceBadgeClass}"
                  th:text="${session.score != null ? #numbers.formatDecimal(session.score,1,1) + '%' : 'N/A'}">85%</span>
        </div>
    </div>

    <div class="accordion animate-in" id="historyAccordion">
        <div class="accordion-item" th:each="ans, stat : ${answers}">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        th:data-bs-target="'#ha' + ${stat.index}">
                    <span class="question-number me-2" th:text="${stat.index + 1}">1</span>
                    <span class="flex-grow-1 me-3" th:text="${#strings.abbreviate(ans.question.questionText, 80)}">Q</span>
                    <span th:class="'badge ms-auto me-2 difficulty-' + ${ans.scoreBadgeClass}"
                          th:text="${ans.score + '%'}">85%</span>
                </button>
            </h2>
            <div th:id="'ha' + ${stat.index}" class="accordion-collapse collapse">
                <div class="accordion-body">
                    <p class="fw-600" th:text="${ans.question.questionText}">Q</p>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="p-3 rounded" style="background:rgba(99,102,241,0.06);border:1px solid var(--border);">
                                <div class="fw-600 mb-2" style="font-size:0.78rem;color:var(--text-muted);text-transform:uppercase;">
                                    <i class="bi bi-person me-1"></i>Your Answer
                                </div>
                                <p style="font-size:0.875rem;margin:0;white-space:pre-wrap;"
                                   th:text="${ans.userAnswer != null && !ans.userAnswer.isBlank() ? ans.userAnswer : '(No answer)'}"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="p-3 rounded" style="background:var(--success-dim);border:1px solid rgba(16,185,129,0.2);">
                                <div class="fw-600 mb-2" style="font-size:0.78rem;color:var(--success);text-transform:uppercase;">
                                    <i class="bi bi-check2-circle me-1"></i>Reference Answer
                                </div>
                                <p style="font-size:0.875rem;margin:0;" th:text="${ans.question.expectedAnswer}"></p>
                            </div>
                        </div>
                    </div>
                    <div th:if="${ans.aiFeedback != null}" class="p-3 rounded"
                         style="background:rgba(99,102,241,0.08);border-left:3px solid var(--primary);">
                        <div class="fw-600 mb-1" style="font-size:0.78rem;color:var(--primary-light);text-transform:uppercase;">
                            <i class="bi bi-robot me-1"></i>AI Feedback
                        </div>
                        <p style="font-size:0.875rem;color:var(--text-muted);margin:0;" th:text="${ans.aiFeedback}"></p>
                    </div>
                    <div class="row g-2 mt-2">
                        <div class="col-md-4" th:if="${ans.strengthList.length > 0}">
                            <div class="fw-600 mb-1" style="font-size:0.75rem;color:var(--success);"><i class="bi bi-check-circle me-1"></i>Strengths</div>
                            <span class="tag-pill tag-strength" th:each="s : ${ans.strengthList}" th:text="${s}">S</span>
                        </div>
                        <div class="col-md-4" th:if="${ans.weaknessList.length > 0}">
                            <div class="fw-600 mb-1" style="font-size:0.75rem;color:var(--danger);"><i class="bi bi-x-circle me-1"></i>Weaknesses</div>
                            <span class="tag-pill tag-weakness" th:each="w : ${ans.weaknessList}" th:text="${w}">W</span>
                        </div>
                        <div class="col-md-4" th:if="${ans.recommendedTopicList.length > 0}">
                            <div class="fw-600 mb-1" style="font-size:0.75rem;color:var(--info);"><i class="bi bi-book me-1"></i>Study Next</div>
                            <span class="tag-pill tag-topic" th:each="t : ${ans.recommendedTopicList}" th:text="${t}">T</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/interview/start(domainId=${session.domain.id})}" class="btn btn-primary">
            <i class="bi bi-arrow-repeat"></i> Retry This Domain
        </a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
