<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="en">
<head th:replace="~{fragments/layout :: head('Select Domain')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">

    <div th:if="${error}" class="alert alert-danger auto-dismiss animate-in">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
    </div>

    <div class="page-header text-center animate-in">
        <h1 class="page-title">Choose Your Domain</h1>
        <p class="page-subtitle">Select a topic and face 10 randomly selected questions</p>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-sm-6 col-md-4 col-lg-3 animate-in"
             th:each="domain, stat : ${domains}"
             th:style="'animation-delay:' + ${stat.index * 0.07} + 's'">
            <a th:href="@{/interview/start(domainId=${domain.id})}" class="domain-card">
                <div class="domain-card-icon">
                    <i th:class="'bi ' + ${domain.icon ?: 'bi-book'}"></i>
                </div>
                <div class="domain-card-name" th:text="${domain.name}">Domain</div>
                <div class="domain-card-desc" th:text="${domain.description}">Description</div>
                <div class="domain-card-meta">
                    <i class="bi bi-play-circle"></i> Start Interview
                </div>
            </a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(domains)}" class="text-center py-5" style="color:var(--text-dim);">
        <i class="bi bi-inbox" style="font-size:3rem;"></i>
        <p class="mt-3">No domains available. Ask the admin to add some!</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
