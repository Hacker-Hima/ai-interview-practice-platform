<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark" lang="en">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>

<div class="auth-wrapper">
    <div class="auth-card animate-in">

        <div class="auth-logo">
            <div class="auth-logo-icon"><i class="bi bi-person-plus-fill"></i></div>
            <h1 class="auth-title mt-2">Create Account</h1>
            <p class="auth-subtitle">Join thousands preparing for technical interviews</p>
        </div>

        <!-- Error -->
        <div th:if="${error}" class="alert alert-danger auto-dismiss mb-3">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}">Error</span>
        </div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">

            <div class="mb-3">
                <label class="form-label" for="regName">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:var(--bg-input);border-color:var(--border);color:var(--text-muted);">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" id="regName" th:field="*{name}" class="form-control"
                           placeholder="Your full name" required/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="regEmail">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:var(--bg-input);border-color:var(--border);color:var(--text-muted);">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" id="regEmail" th:field="*{email}" class="form-control"
                           placeholder="you@example.com" required/>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="regPassword">Password</label>
                <div class="input-group">
                    <span class="input-group-text" style="background:var(--bg-input);border-color:var(--border);color:var(--text-muted);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" id="regPassword" th:field="*{password}" class="form-control"
                           placeholder="Min 6 characters" required minlength="6"/>
                </div>
                <div class="form-text" style="color:var(--text-dim);font-size:0.78rem;">Must be at least 6 characters</div>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary w-100 btn-lg">
                <i class="bi bi-rocket-takeoff"></i> Create Account
            </button>
        </form>

        <div class="divider"></div>

        <p class="text-center mb-0" style="color:var(--text-muted);font-size:0.875rem;">
            Already have an account?
            <a th:href="@{/login}" style="color:var(--primary-light);font-weight:600;">Sign in</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
